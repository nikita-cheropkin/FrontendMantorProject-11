<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="Images/favicon-32x32.png">
    <link rel="stylesheet" href="css/site22.css">
</head>
<body>
    <div class="grid-container">
        <div class="block profile-block">
            <div class="profile-info">
                <img src="Images/image-jeremy.png" alt="" width="80">
                <div class="profile-name">
                    <span>Report for</span>
                    <h1>Jeremy <span>Robson</span></h1>                    
                </div>

            </div>

            <div class="other-info">
                <span data-timeframe="daily" class="dailyOption">Daily</span>
                <span data-timeframe="weekly" class="weeklyOption">Weekly</span>
                <span data-timeframe="monthly" class="monthlyOption">Monthly</span>
            </div>
        </div>

        <div class="block work-block block-hover">
            <img src="Images/icon-work.svg" alt="" width="20">

            <div class="content-block">
                <div class="header-content">
                    <span>Work</span>
                    <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"  
                                fill-rule="evenodd"/>
                    </svg>
                </div>

                <div class="main-content">
                    <span class="hours">32hrs</span>
                    <span class="last-week">Last Week - 36hrs</span>                    
                </div>

            </div>
        </div>

        <div class="block play-block block-hover">
            <img src="Images/icon-play.svg" alt="" width="20">

            <div class="content-block">
                <div class="header-content">
                    <span>Play</span>
                    <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"  
                                fill-rule="evenodd"/>
                    </svg>
                </div>

                <div class="main-content">
                    <span class="hours">10hrs</span>
                    <span class="last-week">Last Week - 8hrs</span>                    
                </div>

            </div>
        </div>

        <div class="block study-block block-hover">
            <img src="Images/icon-study.svg" alt="" width="20">

            <div class="content-block">
                <div class="header-content">
                    <span>Study</span>
                    <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"  
                                fill-rule="evenodd"/>
                    </svg>
                </div>

                <div class="main-content">
                    <span class="hours">32hrs</span>
                    <span class="last-week">Last Week - 5hrs</span>                    
                </div>

            </div>
        </div>

        <div class="block exercise-block block-hover">
            <img src="Images/icon-exercise.svg" alt="" width="20">

            <div class="content-block">
                <div class="header-content">
                    <span>Exercise</span>
                    <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"  
                                fill-rule="evenodd"/>
                    </svg>
                </div>

                <div class="main-content">
                    <span class="hours">4hrs</span>
                    <span class="last-week">Last Week - 5hrs</span>                    
                </div>

            </div>
        </div>

        <div class="block social-block block-hover">
            <img src="Images/icon-social.svg" alt="" width="20">

            <div class="content-block">
                <div class="header-content">
                    <span>Social</span>
                    <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"  
                                fill-rule="evenodd"/>
                    </svg>
                </div>

                <div class="main-content">
                    <span class="hours">5hrs</span>
                    <span class="last-week">Last Week - 10hrs</span>                    
                </div>

            </div>
        </div>

        <div class="block self-care-block block-hover">
            <img src="Images/icon-self-care.svg" alt="" width="20">

            <div class="content-block">
                <div class="header-content">
                    <span>Self Care</span>
                    <svg width="21" height="5" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.5 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm8 0a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Z"  
                                fill-rule="evenodd"/>
                    </svg>
                </div>

                <div class="main-content">
                    <span class="hours">2hrs</span>
                    <span class="last-week">Last Week - 2hrs</span>                    
                </div>

            </div>
        </div>

    </div>

    <script src="script.js" type="module"></script>
</body>
</html>
